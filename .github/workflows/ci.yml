name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r llm/requirements.txt

      - name: Run tests
        run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: python -m pip install pip-audit bandit

      - run: python -m pip_audit -r requirements.txt

      - run: python -m pip_audit -r requirements-runtime.txt

      - run: python -m pip_audit -r llm/requirements.txt

      - run: python -m bandit -r main.py crud.py database.py schemas.py llm

